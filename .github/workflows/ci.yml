# Modified by ygreat for Estate, 2026. Originally part of Terax.
#
# Estate targets Intel Macs on macOS 12 only, so CI runs on GitHub's Intel macOS
# runner. No hosted macOS 12 runner exists: a green run here does not prove a
# change launches on Monterey. That is checked on the reference Mac.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Build Rust code for the same macOS floor as the release.
  MACOSX_DEPLOYMENT_TARGET: "12.0"

jobs:
  frontend:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      # Node 22: Node 24 requires macOS 13.5, and the reference Mac builds with 22.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Audit (advisory)
        run: pnpm audit --prod --audit-level high
        continue-on-error: true

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm check-types

      - name: Test
        run: pnpm test

      - name: React Compiler healthcheck (advisory)
        run: pnpm exec react-compiler-healthcheck
        continue-on-error: true

      - name: Build frontend
        env:
          TAURI_ENV_PLATFORM: darwin
        run: pnpm build

      - name: Size budget
        run: pnpm size

      - name: Dead code (advisory)
        run: pnpm knip
        continue-on-error: true

  terminal-visual:
    name: terminal pixel parity
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: actions/cache@v5
        with:
          path: ~/Library/Caches/ms-playwright
          key: chromium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Terminal compositor pixel parity (DPR 1, 1.25, 1.5, 2)
        env:
          ESTATE_VISUAL_SOFTWARE: '1'
        run: |
          pnpm exec playwright install chromium --no-shell
          pnpm test:terminal-scaling

  rust:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Installs the version pinned in rust-toolchain.toml, with clippy.
      - name: Install pinned Rust
        run: rustup toolchain install

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - uses: taiki-e/install-action@v2.90.2
        with:
          tool: cargo-nextest,cargo-machete

      - name: cargo check
        working-directory: src-tauri
        run: cargo check --all-targets --locked

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Unused crates (advisory)
        working-directory: src-tauri
        run: cargo machete
        continue-on-error: true

      - name: cargo nextest
        working-directory: src-tauri
        run: cargo nextest run --locked --retries 2

      # macOS ships bash 3.2, the same version as Monterey.
      - name: bash shell integration
        run: /bin/bash src-tauri/src/modules/pty/scripts/bashrc.test.bash

      - name: zsh shell integration
        run: python3 src-tauri/src/modules/pty/scripts/zshrc.test.py
